<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atelier Figurine de Ipsos - Depictat.ro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body class="bg-amber-50 text-neutral-800 font-sans">

    <!-- Header -->
    <header class="bg-white shadow-sm py-6 px-4 text-center">
        <h1 class="text-3xl font-bold text-amber-800">Figurine de Ipsos pentru Pictură și Creativitate</h1>
        <p class="text-neutral-600 mt-2">Alege categoria preferată și descoperă colecția noastră!</p>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto p-6">
        
        <!-- Filtre Categorii -->
        <div class="flex flex-wrap justify-center gap-3 mb-8" id="category-filters">
            <button onclick="filterCategory('all')" class="px-4 py-2 bg-amber-700 text-white rounded-full shadow hover:bg-amber-800 transition">Toate</button>
            <button onclick="filterCategory('Animale')" class="px-4 py-2 bg-white text-amber-800 border border-amber-300 rounded-full shadow hover:bg-amber-50 transition">Animale</button>
            <button onclick="filterCategory('Personaje')" class="px-4 py-2 bg-white text-amber-800 border border-amber-300 rounded-full shadow hover:bg-amber-50 transition">Personaje</button>
            <button onclick="filterCategory('Decorațiuni')" class="px-4 py-2 bg-white text-amber-800 border border-amber-300 rounded-full shadow hover:bg-amber-50 transition">Decorațiuni</button>
        </div>

        <!-- Grilă Produse -->
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <p class="col-span-full text-center text-neutral-500">Se încarcă produsele...</p>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white text-center py-6 mt-12 border-t border-amber-100 text-sm text-neutral-500">
        <p>© 2026 Atelier Figurine de Ipsos. Toate drepturile rezervate.</p>
        <p class="mt-1"><a href="/admin/" class="text-amber-700 underline">Autentificare Panou Admin</a></p>
    </footer>

    <!-- SCRIPTURILE PRINCIPALE -->
    <script>
        // Numărul tău de WhatsApp
        const TELEFON_WHATSAPP = '40720018471'; 
        
        // Listă globală pentru produse
        let toateProdusele = [];

        // Funcția de filtrare pe categorii
        function filterCategory(category) {
            if (category === 'all') {
                afiseazaProduse(toateProdusele);
            } else {
                const filtrate = toateProdusele.filter(p => p.category && p.category.toLowerCase() === category.toLowerCase());
                afiseazaProduse(filtrate);
            }
        }

        // Preluare produse din GitHub API
        async function incarcaProduseDinGitHub() {
            const GITHUB_USERNAME = 'figurineipsos-lab'; 
            const REPO_NAME = 'depictat';            

            const grid = document.getElementById('products-grid');

            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/content/produse`);

                if (!response.ok) {
                    throw new Error(`Eroare GitHub API (Status: ${response.status})`);
                }

                const files = await response.json();

                if (!Array.isArray(files) || files.length === 0) {
                    grid.innerHTML = '<p class="col-span-full text-center text-neutral-500">Nu s-a găsit niciun produs în folderul content/produse.</p>';
                    return;
                }

                toateProdusele = [];

                for (const file of files) {
                    if (file.name.endsWith('.md')) {
                        const fileResponse = await fetch(file.download_url);
                        const markdownText = await fileResponse.text();

                        const produs = parseFrontmatter(markdownText);

                        if (produs && produs.title) {
                            toateProdusele.push(produs);
                        }
                    }
                }

                afiseazaProduse(toateProdusele);

            } catch (error) {
                console.error("Eroare la citirea produselor:", error);
                grid.innerHTML = `<p class="col-span-full text-center text-red-500 font-medium">Nu s-au putut încărca produsele. ${error.message}</p>`;
            }
        }

        // Randare carduri produse
        function afiseazaProduse(lista) {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = "";

            if (lista.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center text-neutral-500">Nu există produse de afișat în această categorie.</p>';
                return;
            }

            lista.forEach(produs => {
                const mesajWhatsapp = encodeURIComponent(
                    `Bună ziua! Doresc să comand produsul: "${produs.title}" (${produs.price || '0'} Lei).`
                );
                const linkWhatsapp = `https://wa.me/${TELEFON_WHATSAPP}?text=${mesajWhatsapp}`;

                const productCard = `
                    <div class="bg-white rounded-xl shadow-md overflow-hidden p-4 text-center border border-amber-100 flex flex-col justify-between">
                        <div>
                            <img src="${produs.image || 'https://via.placeholder.com/300x200?text=Fara+Imagine'}" alt="${produs.title}" class="w-full h-48 object-cover rounded-lg mb-4">
                            <h3 class="font-bold text-lg text-neutral-900">${produs.title}</h3>
                            <span class="inline-block bg-amber-100 text-amber-800 text-xs px-2.5 py-1 rounded-full mt-2">${produs.category || 'General'}</span>
                        </div>
                        
                        <div class="mt-4">
                            <p class="text-amber-900 font-bold text-xl mb-3">${produs.price || '0'} Lei</p>
                            
                            <!-- BUTON COMANDĂ WHATSAPP -->
                            <a href="${linkWhatsapp}" target="_blank" class="w-full inline-flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-4 rounded-lg shadow transition">
                                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                                    <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.705 1.754zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.842-1.001z"/>
                                </svg>
                                Comandă pe WhatsApp
                            </a>
                        </div>
                    </div>
                `;
                grid.innerHTML += productCard;
            });
        }

        // Extragere Frontmatter din Markdown
        function parseFrontmatter(text) {
            const match = text.match(/---\s*([\s\S]*?)\s*---/);
            if (!match) return null;

            const frontmatter = {};
            match[1].split('\n').forEach(line => {
                const parts = line.split(':');
                if (parts.length >= 2) {
                    const key = parts[0].trim();
                    const value = parts.slice(1).join(':').trim().replace(/^["'](.+)["']$/, '$1');
                    frontmatter[key] = value;
                }
            });
            return frontmatter;
        }

        // Pornire la încărcarea paginii
        document.addEventListener('DOMContentLoaded', incarcaProduseDinGitHub);
    </script>
</body>
</html>
