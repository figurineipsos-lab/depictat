<!DOCTYPE html>
<html lang="ro">
<head>

<body>

  <h1>Produsele noastre</h1>
  <div id="lista-produse"></div>

  <!-- Pune codul JS chiar aici, înainte de </body> -->
  <script>
    async function incarcaProduse() {
      // 1. Schimbă aceste două variabile cu datele tale reale de GitHub:
      const GITHUB_USERNAME = 'figurineipsos-lab';  // Numele contului/organizației de GitHub
      const REPO_NAME = 'depictat';   // Numele exact al repository-ului

      try {
        const response = await fetch(`https://api.github.com/repos/${figurineipsos-lab}/${depictat}/contents/content/produse`);

        if (!response.ok) {
          console.error("Nu s-au putut încărca produsele. Status:", response.status);
          return;
        }

        const produse = await response.json();
        console.log("Produsele găsite:", produse);

        // Aici poți parcurge produsele și să le afișezi în pagină
      } catch (error) {
        console.error("A apărut o eroare la conexiune:", error);
      }
    }

    // Apelăm funcția când se încarcă pagina
    incarcaProduse();
  </script>
