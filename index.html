<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atelier Figurine de Ipsos</title>
    <!-- Tailwind CSS pentru un design modern rapid -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-amber-50 text-neutral-800 font-sans">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <!-- Header -->
    <header class="bg-white shadow-sm py-6 px-4 text-center">
        <h1 class="text-3xl font-bold text-amber-800">Figurine de Ipsos pentru Pictură și Creativitate</h1>
        <p class="text-neutral-600 mt-2">Alege categoria preferată și descoperă colecția noastră!</p>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto p-6">
        
        <!-- Filtre Categorii -->
        <div class="flex flex-wrap justify-center gap-3 mb-8" id="category-filters">
            <button onclick="filterCategory('all')" class="px-4 py-2 bg-amber-700 text-white rounded-full shadow hover:bg-amber-800 transition">Toate</button>
            <button onclick="filterCategory('Animale')" class="px-4 py-2 bg-white text-amber-800 border border-amber-300 rounded-full shadow hover:bg-amber-50 transition">Animale</button>
            <button onclick="filterCategory('Personaje')" class="px-4 py-2 bg-white text-amber-800 border border-amber-300 rounded-full shadow hover:bg-amber-50 transition">Personaje</button>
            <button onclick="filterCategory('Decorațiuni')" class="px-4 py-2 bg-white text-amber-800 border border-amber-300 rounded-full shadow hover:bg-amber-50 transition">Decorațiuni</button>
        </div>

        <!-- Grilă Produse -->
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
           <script>
async function incarcaProduseDinDecapCMS() {
    const grid = document.getElementById('products-grid');
    
    try {
        // Interogăm API-ul de Git al Netlify pentru folderul content/produse
        const response = await fetch('/.netlify/git/github/contents/content/produse');
        
        if (!response.ok) {
            throw new Error('Nu s-au putut prelua produsele din repository.');
        }

        const files = await response.json();
        
        // Verificăm dacă folderul nu este gol
        if (!Array.isArray(files) || files.length === 0) {
            return;
        }

        grid.innerHTML = ""; // Golim grid-ul de exemplu

        // Parcurgem fiecare fișier `.md` găsit
        for (const file of files) {
            if (file.name.endsWith('.md')) {
                const fileResponse = await fetch(file.download_url);
                const markdownText = await fileResponse.text();
                
                // Extragem datele din formatul YAML frontmatter
                const produs = parseFrontmatter(markdownText);

                if (produs && produs.title) {
                    const productCard = `
                        <div class="bg-white rounded-xl shadow-md overflow-hidden p-4 text-center">
                            <img src="${produs.image || 'https://via.placeholder.com/300x200'}" alt="${produs.title}" class="w-full h-48 object-cover rounded-lg mb-4">
                            <h3 class="font-bold text-lg text-neutral-900">${produs.title}</h3>
                            <span class="inline-block bg-amber-100 text-amber-800 text-xs px-2.5 py-1 rounded-full mt-1">${produs.category || 'General'}</span>
                            <p class="text-neutral-600 font-semibold mt-2">${produs.price || '0'} Lei</p>
                        </div>
                    `;
                    grid.innerHTML += productCard;
                }
            }
        }
    } catch (error) {
        console.error("Eroare la citirea produselor:", error);
    }
}

// Funcție ajutătoare pentru a citi metadata YAML din fișierele Markdown
function parseFrontmatter(text) {
    const match = text.match(/---\s*([\s\S]*?)\s*---/);
    if (!match) return null;
    
    const frontmatter = {};
    match[1].split('\n').forEach(line => {
        const parts = line.split(':');
        if (parts.length >= 2) {
            const key = parts[0].trim();
            const value = parts.slice(1).join(':').trim().replace(/^["'](.+)["']$/, '$1');
            frontmatter[key] = value;
        }
    });
    return frontmatter;
}

document.addEventListener('DOMContentLoaded', incarcaProduseDinDecapCMS);
</script>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white text-center py-6 mt-12 border-t border-amber-100 text-sm text-neutral-500">
        <p>© 2026 Atelier Figurine de Ipsos. Toate drepturile rezervate.</p>
        <p class="mt-1"><a href="/admin/" class="text-amber-700 underline">Autentificare Panou Admin</a></p>
    </footer>

    <!-- Script pentru preluarea automată a produselor (Netlify CMS / Git Gateway) -->
    <script>
        // Funcție simplă de filtrare (exemplu vizual)
        function filterCategory(category) {
            console.log("Filtrare după: " + category);
        }
    </script>
</body>
</html>
